name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r worker/requirements.txt
      - run: cd worker && pytest -q
      - run: python evals/evaluate.py > evaluation-report.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm test && npm run build
      - name: Start full deployment
        run: |
          echo "API_TOKEN=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "WORKER_TOKEN=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -H "Authorization: Bearer $API_TOKEN" http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python scripts/smoke.py
      - run: cd frontend && npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation-report.json
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
